<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy:#131A48; --orange:#FF5800; --orange-h:#FF8C4F; --yellow:#FFFCE8; --grey:#5A5A5A; --grey-l:#CECECE; }
  * { box-sizing:border-box; }
  body { font-family:'Raleway','Segoe UI',sans-serif; width:380px; margin:0; background:#f6f6f4; color:var(--grey); }
  header { background:var(--navy); color:#fff; padding:12px 14px; display:flex; align-items:center; gap:10px; }
  header .logo { background:#fff; border-radius:6px; padding:5px 8px; display:flex; }
  header .logo img { height:18px; display:block; }
  header h1 { font-family:'Spectral',Georgia,serif; color:#fff; font-weight:300; font-size:16px; margin:0; }
  .body { padding:14px; }
  .sub { color:var(--grey); font-size:11.5px; margin-bottom:10px; line-height:1.45; }
  .sub b { color:var(--navy); }
  label { display:block; font-size:11px; color:var(--grey); font-weight:500; margin:9px 0 3px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--grey-l); border-radius:8px; font-size:13px; font-family:inherit; color:var(--navy); background:#fff; }
  textarea { min-height:110px; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,88,0,.12); }
  button { background:var(--orange); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; font-family:inherit; cursor:pointer; margin-top:12px; }
  button:hover { background:var(--orange-h); } button:disabled { opacity:.5; cursor:default; }
  .flex { display:flex; gap:8px; align-items:center; }
  #count { color:var(--grey); font-size:11.5px; }
  #log { margin-top:12px; font-size:12px; max-height:200px; overflow:auto; border-top:1px solid var(--grey-l); padding-top:8px; }
  .r { padding:3px 0; border-bottom:1px solid #ededed; } .ok{color:#137a3a;} .err{color:var(--orange);} .muted{color:var(--grey);}
</style>
</head>
<body>
  <header>
    <span class="logo"><img src="https://cdn.prod.website-files.com/67a44396c211269f785f9dfe/67a4a8650573be9ae072ae9e_Opptra-logo.svg" alt="Opptra"></span>
    <h1>SO Invoice &amp; E-way Bill Downloader</h1>
  </header>
  <div class="body">
    <div class="sub">Run while logged into Unicommerce. Saves to <b>Downloads/opptra-so</b> as <b>&lt;SO&gt;-invoice.pdf</b> or <b>&lt;SO&gt;-eway-bill.pdf</b>.</div>

    <label>Instance base URL</label>
    <input id="base" value="https://oppdoor.unicommerce.co.in">

    <label>What to download</label>
    <select id="doctype">
      <option value="invoice">Invoice</option>
      <option value="eway">E-way Bill</option>
    </select>

    <label>SO numbers (comma or newline separated)</label>
    <textarea id="sos" placeholder="SO02444, SO02445
SO02446"></textarea>

    <div class="flex"><button id="go">Download</button><span id="count" style="margin-left:8px"></span></div>
    <div id="log"></div>
  </div>
<script src="popup.js"></script>
</body>
</html>
